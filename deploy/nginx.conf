# /etc/nginx/sites-available/alfurqancollege.com.ng
# certbot --nginx adds the HTTPS server block and the HTTP->HTTPS redirect.
server {
    listen 80;
    server_name alfurqancollege.com.ng www.alfurqancollege.com.ng;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/alfurqancollege/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /var/www/alfurqancollege/media/;
    }

    location / {
        proxy_pass http://unix:/var/www/alfurqancollege/alfurqancollege.sock;
        include proxy_params;
        proxy_read_timeout 120s;
    }
}
